# TrainLab AI — local development stack.
# One command boots the whole platform:  docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: trainlab_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trainlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainlab}
      POSTGRES_DB: ${POSTGRES_DB:-trainlab}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trainlab}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PLACEHOLDER: Redis is provisioned for Release 2 (Celery / task queue /
  # caching). Release 1 does not connect to it.
  redis:
    image: redis:7-alpine
    container_name: trainlab_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: trainlab_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      POSTGRES_USER: ${POSTGRES_USER:-trainlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainlab}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trainlab}
      REDIS_URL: redis://redis:6379/0
      BACKEND_CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: trainlab_frontend
    depends_on:
      - backend
    environment:
      # Server-side proxy target for /api/* (browser only talks to :3000).
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
